name: CI

# ThreeM moves other people's photo libraries. Every push and PR has to clear
# the same gate the phase-01 safety net established locally: formatting, a
# clippy run with `-D warnings` (which makes the pedantic group in
# `code/Cargo.toml` binding), and the full test suite including the integration
# suites that drive the real `mmm` binary.
#
# The crate root is `code/`, not the repository root, so every cargo step needs
# `working-directory: code`.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report independently — a Linux failure must not hide a
      # macOS-only one, and vice versa. The integration suites touch the
      # filesystem, where the two genuinely differ (APFS vs ext4 scan order,
      # case sensitivity).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The workspace lives one level down; without this the action looks
          # for `Cargo.lock` at the repository root and caches nothing.
          workspaces: code

      - name: cargo fmt --check
        working-directory: code
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        working-directory: code
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --all-targets
        working-directory: code
        run: cargo test --all-targets

  coverage:
    name: coverage floors (organiser · journal)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
          # Instrumented builds share nothing with the plain test profile.
          key: coverage

      - name: cargo llvm-cov
        working-directory: code
        run: cargo llvm-cov --json --output-path coverage.json

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: code/coverage.json

      # The two files that move and record other people's photographs. Every
      # other module is measured and reported; these two are the only ones with
      # a floor, because a drop here means a destructive branch stopped being
      # exercised — which is the failure this whole gate exists to catch.
      #
      # The floors sit one point under the figures measured when they were set
      # (organiser.rs 92.76%, journal.rs 96.88% — see
      # docs/research/coverage-report.md). The margin absorbs the handful of
      # `#[cfg(unix)]` tests and platform-specific error kinds that genuinely
      # differ between runners; it is not room to let coverage rot. Raise both
      # numbers when the real figure rises.
      - name: Enforce the floors
        working-directory: code
        run: |
          set -euo pipefail
          check() {
            file="$1"
            floor="$2"
            actual=$(jq -r --arg f "$file" '
              .data[0].files[]
              | select(.filename | endswith($f))
              | .summary.lines.percent
            ' coverage.json)
            if [ -z "$actual" ] || [ "$actual" = "null" ]; then
              echo "::error::$file is absent from the coverage report"
              exit 1
            fi
            printf '%s: %.2f%% (floor %s%%)\n' "$file" "$actual" "$floor"
            if awk -v a="$actual" -v f="$floor" 'BEGIN { exit !(a < f) }'; then
              echo "::error::$file line coverage $actual% is below the floor of $floor%"
              exit 1
            fi
          }
          check src/organiser.rs 92.0
          check src/journal.rs 96.0

  fuzz:
    name: fuzz (60s per target)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned, not floating on `nightly`. The current nightly does not compile
      # `nom-exif` 1.5.2 — a change in what a range expression means, in a
      # dependency, unrelated to fuzzing. `code/fuzz/README.md` records the exact
      # error and the condition for unpinning.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01

      - uses: taiki-e/install-action@cargo-fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          # The fuzz crate is its own workspace, built under a different
          # toolchain with sanitiser flags. It shares nothing with the entries
          # above.
          workspaces: code/fuzz
          key: fuzz

      # Sixty seconds a target is not a fuzzing campaign, and it is not meant to
      # be — a real campaign runs for hours and belongs on somebody's machine or
      # a nightly schedule. What this catches is the two things a pull request
      # can break: a change that makes one of the checked-in regression seeds
      # crash again, and a shallow new panic reachable from them. Every run
      # starts from `fuzz/corpus/`, so the seeds are executed first and a
      # returning crash fails in the first second rather than the sixtieth.
      #
      # `-timeout=10` matters more than it looks. libFuzzer's default per-unit
      # timeout is twenty minutes, so an input that sends a parser into an
      # infinite loop would hang the job until GitHub killed it with no useful
      # output. Ten seconds turns that into a reported failure naming the input.
      - name: Run each target
        working-directory: code
        run: |
          set -euo pipefail
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            mkdir -p "fuzz/scratch/$target"
            cargo fuzz run "$target" \
              "fuzz/scratch/$target" "fuzz/corpus/$target" \
              -- -max_total_time=60 -timeout=10 -print_final_stats=1
            echo "::endgroup::"
          done

      # The input that crashed it, so the failure can be reproduced locally
      # rather than re-fuzzed for.
      - name: Upload any crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: code/fuzz/artifacts/
          if-no-files-found: ignore

  release-build:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
          # Distinct cache from the `test` job: the release profile sets
          # `lto = true` and `codegen-units = 1`, so it shares no artifacts
          # with the dev profile and would otherwise thrash the same entry.
          key: release

      - name: cargo build --release
        working-directory: code
        # The release profile (`lto = true`, `codegen-units = 1`,
        # `strip = true`) exercises code paths the dev profile never compiles.
        # This job exists to catch breakage that only appears there.
        run: cargo build --release
