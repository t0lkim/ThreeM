name: CI

# ThreeM moves other people's photo libraries. Every push and PR has to clear
# the same gate the phase-01 safety net established locally: formatting, a
# clippy run with `-D warnings` (which makes the pedantic group in
# `code/Cargo.toml` binding), and the full test suite including the integration
# suites that drive the real `mmm` binary.
#
# The crate root is `code/`, not the repository root, so every cargo step needs
# `working-directory: code`.

#
# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment. A
# tag is mutable — whoever controls the action's repository can move `v4` to a
# different commit, and every workflow that trusts the tag runs the new code on
# its next build. A SHA cannot be moved.
#
# The cost is that pins do not update themselves. To refresh one:
#
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> -q .object.sha
#
# (dereference once more via `git/tags/<sha>` if that returns an annotated tag),
# or for a branch-tracking action:
#
#   gh api repos/<owner>/<repo>/commits/<branch> -q .sha
#
# The trailing comment is what makes that possible — without it nobody can tell
# which version a SHA was.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test (${{ matrix.os }} · TZ=${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms report independently — a Linux failure must not hide a
      # macOS-only one, and vice versa. The integration suites touch the
      # filesystem, where the two genuinely differ (APFS vs ext4 scan order,
      # case sensitivity).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The machine's zone is an input to this crate, not a detail of the
        # runner. `metadata.rs` reads a naive EXIF timestamp against it whenever
        # the file carries no `OffsetTime*` tag, and getting that wrong files an
        # evening photograph on the wrong day — the defect 0.2.0 shipped to fix.
        # UTC alone cannot catch a regression there, because UTC is the one zone
        # for which the wrong answer and the right answer agree.
        #
        # Three zones, chosen for what each can break rather than for coverage:
        # UTC as the control, a whole-hour zone well east of Greenwich, and one
        # west of it far enough that a morning photograph crosses midnight the
        # other way.
        tz: [UTC, Asia/Singapore, America/New_York]

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The workspace lives one level down; without this the action looks
          # for `Cargo.lock` at the repository root and caches nothing.
          workspaces: code

      # `--locked` on every cargo invocation that resolves dependencies: a
      # change to `Cargo.toml` that leaves `Cargo.lock` stale was silently
      # updated in the runner and passed, so CI was testing a dependency set
      # nobody had committed.
      - name: cargo fmt --check
        working-directory: code
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        working-directory: code
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test --all-targets
        working-directory: code
        run: cargo test --locked --all-targets

  msrv:
    name: MSRV ${{ matrix.os }} (from Cargo.toml rust-version)
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms, because the floor is not a property of the language
      # alone: `organiser::errno` is `cfg`-split per platform and the two halves
      # can reach for different std methods, so a macOS-only MSRV break would
      # otherwise surface on a contributor's machine rather than here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # `rust-version` in `code/Cargo.toml` is a promise to anyone running
    # `cargo install mmm` on a distribution's Rust rather than the newest one.
    # A promise nothing checks is a guess: the floor was 1.87 the day it was
    # measured, and the next dependency bump or `let`-chain can raise it without
    # anybody noticing on a stable toolchain.
    #
    # The number lives in `Cargo.toml` and is read out of it here, so there is
    # one place to change it. Both halves of the gate run, because the reason the
    # floor is 1.87 rather than 1.86 is a std method used in the *test* fixtures
    # — a build-only check would happily pass at a version the suite cannot
    # compile at.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the MSRV out of Cargo.toml
        id: msrv
        working-directory: code
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no rust-version in code/Cargo.toml"
            exit 1
          fi
          echo "MSRV is $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: code
          # A different compiler produces different artifacts; sharing the
          # `test` job's entry would thrash it on every run. The platform is in
          # the key for the same reason, now that this job runs on both.
          key: msrv-${{ matrix.os }}

      - name: cargo build --release
        working-directory: code
        run: cargo build --locked --release

      - name: cargo test --all-targets
        working-directory: code
        run: cargo test --locked --all-targets

  coverage:
    name: coverage floors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Line coverage of the same source is largely platform-independent, but
      # `organiser.rs` is not the same source on both: `errno` is `cfg`-split,
      # and the arm that is compiled out on one platform is the arm whose lines
      # go uncounted there. A floor met on Linux alone says nothing about the
      # macOS-only branch beneath it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: code
          # Instrumented builds share nothing with the plain test profile.
          key: coverage-${{ matrix.os }}

      - name: cargo llvm-cov
        working-directory: code
        run: cargo llvm-cov --locked --json --output-path coverage.json

      - name: Upload the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-json-${{ matrix.os }}
          path: code/coverage.json

      # The two files that move and record other people's photographs. Every
      # other module is measured and reported; these two are the only ones with
      # a floor, because a drop here means a destructive branch stopped being
      # exercised — which is the failure this whole gate exists to catch.
      #
      # The floors sit one point under the figures measured when they were set
      # (organiser.rs 92.76%, journal.rs 96.88% — see
      # docs/research/coverage-report.md). The margin absorbs the handful of
      # `#[cfg(unix)]` tests and platform-specific error kinds that genuinely
      # differ between runners; it is not room to let coverage rot. Raise both
      # numbers when the real figure rises.
      - name: Enforce the floors
        working-directory: code
        run: |
          set -euo pipefail
          check() {
            file="$1"
            floor="$2"
            actual=$(jq -r --arg f "$file" '
              .data[0].files[]
              | select(.filename | endswith($f))
              | .summary.lines.percent
            ' coverage.json)
            if [ -z "$actual" ] || [ "$actual" = "null" ]; then
              echo "::error::$file is absent from the coverage report"
              exit 1
            fi
            printf '%s: %.2f%% (floor %s%%)\n' "$file" "$actual" "$floor"
            if awk -v a="$actual" -v f="$floor" 'BEGIN { exit !(a < f) }'; then
              echo "::error::$file line coverage $actual% is below the floor of $floor%"
              exit 1
            fi
          }
          check src/organiser.rs 92.0
          check src/journal.rs 96.0

  fuzz:
    name: fuzz (60s per target, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # The parsers are platform-independent Rust, so the *inputs* explored are
      # the same — but the sanitiser underneath them is not. libFuzzer and ASan
      # on aarch64-apple-darwin are a different runtime to the x86_64-linux one,
      # and a fuzzing gate that only ever ran under one of them is a gate with a
      # platform-shaped hole. Verified to work on arm64 macOS before this was
      # added, rather than added and hoped for.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned, not floating on `nightly`. The current nightly does not compile
      # `nom-exif` 1.5.2 — a change in what a range expression means, in a
      # dependency, unrelated to fuzzing. `code/fuzz/README.md` records the exact
      # error and the condition for unpinning.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-05-01

      # Pinned to the `v2` release, not to `main`. A `main` SHA was tried and
      # broke the job: that build of install-action has no entry for cargo-fuzz,
      # so it fell back to `cargo-binstall`, which fetches a musl-static
      # prebuilt — and a statically linked libc is incompatible with the
      # sanitizer cargo-fuzz builds against. The failure surfaced two commits
      # later as `sanitizer is incompatible with statically linked libc`, which
      # names the symptom and not the cause.
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-fuzz

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The fuzz crate is its own workspace, built under a different
          # toolchain with sanitiser flags. It shares nothing with the entries
          # above.
          workspaces: code/fuzz
          key: fuzz-${{ matrix.os }}

      # Sixty seconds a target is not a fuzzing campaign, and it is not meant to
      # be — a real campaign runs for hours and belongs on somebody's machine or
      # a nightly schedule. What this catches is the two things a pull request
      # can break: a change that makes one of the checked-in regression seeds
      # crash again, and a shallow new panic reachable from them. Every run
      # starts from `fuzz/corpus/`, so the seeds are executed first and a
      # returning crash fails in the first second rather than the sixtieth.
      #
      # `-timeout=10` matters more than it looks. libFuzzer's default per-unit
      # timeout is twenty minutes, so an input that sends a parser into an
      # infinite loop would hang the job until GitHub killed it with no useful
      # output. Ten seconds turns that into a reported failure naming the input.
      - name: Run each target
        working-directory: code
        run: |
          set -euo pipefail
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            mkdir -p "fuzz/scratch/$target"
            cargo fuzz run "$target" \
              "fuzz/scratch/$target" "fuzz/corpus/$target" \
              -- -max_total_time=60 -timeout=10 -print_final_stats=1
            echo "::endgroup::"
          done

      # The input that crashed it, so the failure can be reproduced locally
      # rather than re-fuzzed for.
      - name: Upload any crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: code/fuzz/artifacts/
          if-no-files-found: ignore

  release-build:
    name: release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: code
          # Distinct cache from the `test` job: the release profile sets
          # `lto = true` and `codegen-units = 1`, so it shares no artifacts
          # with the dev profile and would otherwise thrash the same entry.
          key: release

      - name: cargo build --release
        working-directory: code
        # The release profile (`lto = true`, `codegen-units = 1`,
        # `strip = true`) exercises code paths the dev profile never compiles.
        # This job exists to catch breakage that only appears there.
        run: cargo build --locked --release
