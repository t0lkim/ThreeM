name: Release

# Fires on a `v*` tag and nothing else. Pushing the tag is the decision to
# release; everything below is the consequence of it.
#
# The order of the jobs is the whole point of the file. Nothing is published
# until the full test gate has passed on both platforms, because a release is
# the one artefact a user cannot undo by pulling again — somebody downloads a
# binary that moves their photograph library, and no amount of reverting the
# tag takes it off their disk.
#
#   verify → gate → build (3 targets) → publish
#
# `verify` is first and cheap: it fails a tag whose version does not match
# `code/Cargo.toml`, or whose changelog section was never written, in about
# fifteen seconds rather than after twenty minutes of LTO builds.
#
# The two scripts this calls live in `.github/scripts/` rather than inline
# here, so the packaging and the changelog extraction can be run locally
# against a real build before a tag exists. They were.

#
# Every `uses:` is pinned to a commit SHA with its tag in a trailing comment. A
# tag is mutable — whoever controls the action's repository can move `v4` to a
# different commit, and every workflow that trusts the tag runs the new code on
# its next build. A SHA cannot be moved.
#
# The cost is that pins do not update themselves. To refresh one:
#
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> -q .object.sha
#
# (dereference once more via `git/tags/<sha>` if that returns an annotated tag),
# or for a branch-tracking action:
#
#   gh api repos/<owner>/<repo>/commits/<branch> -q .sha
#
# The trailing comment is what makes that possible — without it nobody can tell
# which version a SHA was.

on:
  push:
    tags:
      - 'v*'

  # A rehearsal. Until this existed the first real tag was also the first
  # execution of this file, and `gh release create` is not idempotent — so a
  # workflow that failed half way through left a partial release to be deleted
  # by hand before it could be retried.
  #
  # Dispatched runs build, check and package exactly as a tagged run does, and
  # stop before publishing. The artifacts are on the run, downloadable, so the
  # binaries can be inspected before anything is public.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, without the leading v (e.g. 0.3.0)'
        required: true
        type: string

# Read-only by default; only `publish` is granted write, and only to contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A tag is a claim about a commit, and the two ways it can be false are
      # both silent: `v0.2.0` on a tree whose Cargo.toml still says 0.1.0 ships
      # binaries that report the wrong version out of `--version`, and a tag
      # with no changelog section ships a release with an empty body.
      - name: Tag version matches Cargo.toml
        id: version
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            version='${{ inputs.version }}'
            tag="v$version"
            echo "rehearsal for $tag (no tag exists, nothing will be published)"
          else
            tag='${{ github.ref_name }}'
            version="${tag#v}"
          fi
          declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' code/Cargo.toml | head -1)
          echo "tag $tag → version $version; code/Cargo.toml declares $declared"
          if [ "$version" != "$declared" ]; then
            echo "::error::$tag does not match the version in code/Cargo.toml ($declared)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version with a pre-release identifier (0.2.0-rc.1) is marked as a
          # pre-release on GitHub rather than silently becoming "latest".
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > release-notes.md

      # Uploaded rather than re-extracted in `publish`, so the body that will be
      # posted is inspectable on a run that failed later on for another reason.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md

  gate:
    name: gate (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    # The same gate `ci.yml` runs on every push, run again here against the
    # tagged commit. It is not redundant with CI: CI proves the commit was green
    # when it was pushed, and this proves it is green now, on the tree the
    # binaries below are about to be built from. A failing test here stops the
    # release, which is the requirement.
    #
    # `cargo build --release` is the gate's fourth command and is not repeated
    # here — the `build` job does exactly that, per target, and cannot start
    # until this job has passed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: code

      - name: cargo fmt --check
        working-directory: code
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        working-directory: code
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --all-targets
        working-directory: code
        run: cargo test --all-targets

  build:
    name: ${{ matrix.target }}
    needs: [verify, gate]
    runs-on: ${{ matrix.os }}
    strategy:
      # Every target reports independently. A macOS linker failure must not
      # hide whether the Linux binary built.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS runners are arm64, so this one is native and the next is a
          # cross-compile that the Apple toolchain handles without a separate
          # linker. Both were built and unpacked locally before this file was
          # written; `file` confirms the archives hold different architectures
          # rather than two copies of the host's.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: code
          # The release profile shares no artifacts with the dev profile the
          # gate above builds, and each target is its own directory.
          key: release-${{ matrix.target }}

      - name: cargo build --release --target ${{ matrix.target }}
        working-directory: code
        run: cargo build --locked --release --target ${{ matrix.target }}

      # One declaration, read here rather than restated. `package-release.sh`
      # names the binaries a release ships on a single `BINARIES=` line, and
      # `code/tests/release.rs` holds that line against the crate's `[[bin]]`
      # targets. The two checks below iterate what this step reads, so a fourth
      # binary is covered by being added to the crate — not by somebody
      # remembering that the workflow keeps its own list.
      #
      # It used to keep one, implicitly: both checks named `mmm` and nothing
      # else, so `mmm-dedup-verifier` and `mmm-fixtures` were archived and
      # published without ever being started. That is the same shape as the
      # cross-compile problem below, one level up — a thing shipped that nobody
      # ran.
      - name: Read the binary list from the packaging script
        run: |
          set -euo pipefail
          binaries=$(sed -n 's/^BINARIES="\(.*\)"$/\1/p' .github/scripts/package-release.sh)
          # An empty list is the dangerous outcome rather than an obvious one:
          # every loop below would run zero times and every check would report
          # success having examined nothing.
          if [ -z "$binaries" ]; then
            echo "::error::package-release.sh no longer declares BINARIES on its own line, \
              so there is nothing to arch-check or smoke-run"
            exit 1
          fi
          echo "binaries: $binaries"
          echo "RELEASE_BINARIES=$binaries" >> "$GITHUB_ENV"

      # The published binaries used to reach users without anybody having run
      # them: `x86_64-apple-darwin` is cross-compiled on an arm64 runner, and
      # `x86_64-unknown-linux-gnu` was only ever type-checked. A cross-compile
      # that silently produced the host's architecture, or a binary that linked
      # but could not start, would have been discovered by whoever downloaded
      # it.
      #
      # Two checks, and they answer different questions. `file` asks whether
      # this is the architecture the matrix asked for — the failure a
      # cross-compile makes and a native build cannot. The smoke run asks
      # whether it *works*: starting proves the dynamic linking, and doing a
      # small real piece of work proves the code paths behind it execute, which
      # linking alone says nothing about.
      #
      # All three binaries come out of the one `cargo build` above, so checking
      # each one's architecture catches nothing the `mmm` check alone did not.
      # It loops anyway because the loop is already here for the smoke run, and
      # "every packaged binary is the architecture we asked for" is a simpler
      # thing to keep true than "one representative is, and here is why that
      # generalises" — an argument that would stop holding, silently, the day a
      # binary is produced some other way.
      - name: Check the architecture is the one that was asked for
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) expect="x86-64" ;;
            x86_64-apple-darwin)      expect="x86_64" ;;
            aarch64-apple-darwin)     expect="arm64" ;;
            *) echo "::error::no architecture expectation for ${{ matrix.target }}"; exit 1 ;;
          esac
          for name in $RELEASE_BINARIES; do
            bin="code/target/${{ matrix.target }}/release/$name"
            described=$(file -b "$bin")
            echo "$bin: $described"
            if ! printf '%s' "$described" | grep -q -- "$expect"; then
              echo "::error::${{ matrix.target }} produced '$described' for $name, \
                which is not $expect — the cross-compile fell back to the host"
              exit 1
            fi
          done

      # The arm64 macOS runner executes the Intel binaries through Rosetta. All
      # three were built for `x86_64-apple-darwin` and run on an arm64 machine
      # before this was written, `--version` and the real work below, so this is
      # not being discovered here. If a runner ever lacks Rosetta the step says
      # so and moves on: a binary that cannot be *started here* is not a defect
      # in the binary, and failing the release over it would be reporting the
      # runner's limits as the artifact's.
      - name: Smoke-run the binaries
        run: |
          set -euo pipefail
          bin_dir="$PWD/code/target/${{ matrix.target }}/release"

          # Asked once, of one binary. Whether this architecture can execute
          # here is a property of the runner, so the answer is the same for all
          # three and asking three times would only make the skip harder to read.
          if ! "$bin_dir/mmm" --version >/dev/null 2>&1; then
            echo "::notice::${{ matrix.target }} cannot be executed on this runner; \
              skipping the smoke run"
            exit 0
          fi

          # `--version` is a low bar on purpose: clap answers it and exits
          # before `main` does anything, so what it proves is that the file
          # loads and its dynamic libraries resolve. Each binary then does a
          # piece of real work below.
          for name in $RELEASE_BINARIES; do
            echo "$name: $("$bin_dir/$name" --version)"
          done

          scratch=$(mktemp -d)

          # mmm: a dry run over a throwaway file exercises the scan, the
          # metadata read and the planner. No --commit — the smoke test must not
          # be the one thing in this workflow that moves a file.
          printf 'not a real photograph' > "$scratch/smoke.jpg"
          "$bin_dir/mmm" organise "$scratch" -o "$scratch/out" --no-config
          if [ -e "$scratch/out" ]; then
            echo "::error::a preview created $scratch/out — the default posture is broken"
            exit 1
          fi

          # mmm-fixtures: build the smallest library there is. This is the whole
          # generator — image encoding, EXIF writing, and the document that
          # states where each file should end up — and the document is what
          # makes a generated library worth anything, so its absence is the
          # failure worth naming rather than a non-zero exit alone.
          "$bin_dir/mmm-fixtures" --profile minimal "$scratch/library"
          if [ ! -s "$scratch/library/EXPECTED.md" ]; then
            echo "::error::mmm-fixtures built a library with no EXPECTED.md, so there is \
              nothing for a user to check their first run against"
            exit 1
          fi

          # mmm-dedup-verifier: a real verification needs a duplicates/
          # directory and a manifest, which only `mmm --commit` produces — and
          # this job deliberately never commits. What can be run without moving
          # a file is the refusal, and that is worth more than `--version`: it
          # is the first thing `main` does, so it proves the binary's own code
          # executes rather than only clap's.
          if "$bin_dir/mmm-dedup-verifier" "$scratch/not-a-directory" >/dev/null 2>&1; then
            echo "::error::mmm-dedup-verifier accepted a path that is not a directory, \
              so its argument checking is not running"
            exit 1
          fi

          rm -rf "$scratch"

      # Archives the three binaries with README, LICENSE and CHANGELOG, writes a
      # .sha256 beside the tarball, and refuses to package a binary that still
      # carries its symbols — `[profile.release] strip = true` is one line, and
      # deleting it would otherwise ship debug symbols silently.
      - name: Archive and checksum
        run: .github/scripts/package-release.sh ${{ matrix.target }} ${{ needs.verify.outputs.version }} dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [verify, build]
    # Never on a rehearsal. A dispatched run exists to prove the build and
    # packaging work; publishing from one would make the rehearsal the thing it
    # was meant to de-risk.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: List what is about to be published
        run: |
          set -euo pipefail
          ls -l dist
          echo "--- checksums ---"
          cat dist/*.tar.gz.sha256
          echo "--- they verify ---"
          (cd dist && sha256sum -c ./*.tar.gz.sha256)

      # `gh` is on the runner already, so there is no third-party action in the
      # one step that holds a write token.
      #
      # **A draft.** The release is created with its binaries and notes attached
      # and is visible only to people who can write to the repository, until
      # somebody presses publish. That turns the moment of no return from
      # "pushing a tag" into "reading the release page and deciding" — which
      # matters because `gh release create` is not idempotent, so recovering
      # from a bad run means deleting a release the public may already have
      # seen.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create '${{ github.ref_name }}' \
            --repo '${{ github.repository }}' \
            --title 'mmm ${{ needs.verify.outputs.version }}' \
            --notes-file dist/release-notes.md \
            --draft \
            ${{ needs.verify.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/*.tar.gz dist/*.tar.gz.sha256

          echo "::notice::Draft release created. Review it, then publish with: \
            gh release edit '${{ github.ref_name }}' --draft=false"
