[package]
name = "mmm"
version = "0.3.3"
edition = "2021"
description = "Image and video organiser with deduplication, EXIF-based renaming, and date-based directory structure"
authors = ["Mike Lott <me@t0lkim.dev>"]
license = "MIT"
repository = "https://github.com/t0lkim/ThreeM"
homepage = "https://github.com/t0lkim/ThreeM"
documentation = "https://github.com/t0lkim/ThreeM/blob/main/docs/index.md"
# There is no docs.rs page and no separate site: the crate is not published to
# crates.io, and its documentation is prose in `docs/`, not rustdoc over a
# library meant for third-party callers. Pointing `documentation` at the docs
# index is therefore the true answer rather than a placeholder.
readme = "../README.md"
keywords = ["photos", "exif", "deduplication", "organiser", "metadata"]
categories = [
    "command-line-utilities",
    "multimedia::images",
    "multimedia::video",
    "filesystem",
]
# The floor is measured, not guessed, and its own CI job builds and tests here.
# It used to be a floor only the tests imposed: `is_multiple_of`, stabilised in
# 1.87, lived in `tests/common/mod.rs` while the library and both binaries built
# on 1.86. The fixtures then moved into `src/fixtures.rs` so `mmm-fixtures` could
# ship them, and the call came with them — so 1.87 now binds the library and all
# three binaries. Same number, different reason; the `msrv` job measures it
# either way.
rust-version = "1.87.0"

[dependencies]
# 1.0.103 is the floor, not a preference: RUSTSEC-2026-0190 is an unsoundness
# advisory against `Error::downcast_mut()` in 1.0.102 and earlier. Nothing here
# calls `downcast_mut`, so the unsound path was never reachable — but `1` as a
# floor lets a fresh resolve land back on the advisory version, and a user
# running `cargo audit` cannot tell an unreachable advisory from a live one.
anyhow = "1.0.103"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
nom-exif = "1"
reverse_geocoder = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2"
walkdir = "2"
toml = "1.1.4"
directories = "6.0.0"
# `skip_patterns` are globs. Hand-rolling the matcher would mean hand-rolling
# character classes, `**` and escaping — three places to be subtly wrong about
# which of somebody's photographs get passed over.
globset = "0.4"
# IANA zone names for `default_timezone`. A fixed `+08:00` could be parsed with
# `chrono` alone, but a fixed offset is wrong for half the year anywhere that
# observes daylight saving — `Europe/Lisbon` is not `+00:00` in July — and a
# setting that silently mis-files six months of somebody's library is worse than
# no setting. Default features off: the tz database is all that is wanted, not
# the build-time regeneration machinery.
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
# XMP sidecars, which are RDF/XML. A pull parser rather than an RDF stack: the
# whole of what this reads is three date properties out of one description, and
# an RDF library would bring a graph model, a triple store and a resolver to
# answer a question a streaming reader answers in one pass. Default features
# only — no serde, no encoding detection; an XMP packet is XML and declares
# itself UTF-8.
quick-xml = "0.41"
# Parallel hashing for the dedup cascade. Phase 3 is 92% of the cascade's time
# (`docs/research/hashing-baseline.md`) and runs at roughly single-threaded
# BLAKE3 speed — one core busy, the rest idle. A work-stealing pool is the right
# shape for it because the candidate sets are wildly uneven: one group may hold
# two 4 GB videos and the next two hundred thumbnails, so a hand-rolled
# chunk-per-thread split would leave threads idling on the short chunks.
rayon = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
# Throughput measurement for the dedup cascade. A parallelisation change with no
# benchmark is a guess, and the numbers have to survive being compared against
# each other months apart — criterion's warm-up, outlier detection and saved
# baselines do that, a hand-rolled `Instant::now()` loop does not.
#
# Default features off: `plotters` and `rayon` exist to draw the HTML report,
# which nothing here reads — the numbers are transcribed into
# `docs/research/hashing-baseline.md` by hand so they are reviewable in the diff.
# `cargo_bench_support` is the one that makes `cargo bench` work at all.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# NOTE: `walkdir` is a normal dependency above. Cargo makes normal dependencies
# available to test targets too, so it needs no promotion here for the
# `snapshot_tree` helper the integration suites will use.

[features]
# `repository-tests` is on by default and exists to be switched *off* by one
# caller. `tests/docs.rs` and `tests/release.rs` assert facts about files that
# live at the repository root — `README.md`, `CONTRIBUTING.md`, `SECURITY.md`,
# `.github/` — and those files are outside the cargo package. Any tool that
# builds the package in isolation therefore has no repository above it, and
# both targets fail on a missing file rather than on a broken claim.
#
# `cargo-mutants` is that tool: it copies the package into a temp directory for
# every mutant, so the whole suite was unrunnable under it. It turns this off
# via `no_default_features` in `.cargo/mutants.toml`. Nothing else does — an
# ordinary `cargo test`, `cargo test --all-targets`, CI and the coverage job
# all run both targets exactly as before.
default = ["repository-tests"]
repository-tests = []

[lib]
name = "mmm"
path = "src/lib.rs"

[[bin]]
name = "mmm"
path = "src/main.rs"

[[bin]]
name = "mmm-dedup-verifier"
path = "src/bin/mmm_dedup_verifier.rs"

[[bin]]
name = "mmm-fixtures"
path = "src/bin/mmm_fixtures.rs"

# The only two test targets that read outside the package. Declared explicitly
# so the dependency is visible here rather than only in the failure message;
# every other file under `tests/` is still auto-discovered and unconditional.
[[test]]
name = "docs"
path = "tests/docs.rs"
required-features = ["repository-tests"]

[[test]]
name = "release"
path = "tests/release.rs"
required-features = ["repository-tests"]

# `harness = false` hands `main` to criterion instead of libtest, which is how
# criterion collects samples at all.
[[bench]]
name = "hashing"
harness = false

[lints.clippy]
# ThreeM moves other people's photo libraries. A panic mid-run leaves a tree
# half-organised, so panicking helpers are banned outside `#[cfg(test)]`
# modules (which carry a local `allow` — a test that unwraps is a test that
# fails loudly, which is what we want there).
#
# NOTE for integration tests: files under `tests/` are separate crates, so the
# in-module `allow` does not reach them. Each `tests/*.rs` needs its own
# crate-level attribute at the top of the file:
#
#   #![allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"

# Pedantic is on as a warning group; `-D warnings` in CI makes it binding.
# `priority = -1` lets the individual `allow`s below win over the group.
pedantic = { level = "warn", priority = -1 }

# Deliberately suppressed pedantic lints:
#   must_use_candidate  — noisy across a mostly-internal API surface; the
#                         library exists to be driven by the two binaries and
#                         the integration tests, not by third-party callers.
#   too_many_lines      — the scan/plan/move pipeline in `main` and the
#                         verifier reads better as one linear narrative than
#                         as a chain of single-call-site helpers.
#   large_stack_arrays  — the 64 KiB hashing read buffers are a deliberate
#                         throughput choice, not an oversight.
must_use_candidate = "allow"
too_many_lines = "allow"
large_stack_arrays = "allow"

[profile.release]
lto = true
strip = true
codegen-units = 1
