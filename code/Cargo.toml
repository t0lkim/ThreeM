[package]
name = "mmm"
version = "0.1.0"
edition = "2021"
description = "Image and video organiser with deduplication, EXIF-based renaming, and date-based directory structure"
authors = ["Mike Lott <me@t0lkim.dev>"]
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
nom-exif = "1"
reverse_geocoder = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2"
walkdir = "2"
toml = "1.1.4"
directories = "6.0.0"
# `skip_patterns` are globs. Hand-rolling the matcher would mean hand-rolling
# character classes, `**` and escaping — three places to be subtly wrong about
# which of somebody's photographs get passed over.
globset = "0.4"
# IANA zone names for `default_timezone`. A fixed `+08:00` could be parsed with
# `chrono` alone, but a fixed offset is wrong for half the year anywhere that
# observes daylight saving — `Europe/Lisbon` is not `+00:00` in July — and a
# setting that silently mis-files six months of somebody's library is worse than
# no setting. Default features off: the tz database is all that is wanted, not
# the build-time regeneration machinery.
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
# NOTE: `walkdir` is a normal dependency above. Cargo makes normal dependencies
# available to test targets too, so it needs no promotion here for the
# `snapshot_tree` helper the integration suites will use.

[lib]
name = "mmm"
path = "src/lib.rs"

[[bin]]
name = "mmm"
path = "src/main.rs"

[[bin]]
name = "mmm-dedup-verifier"
path = "src/bin/mmm_dedup_verifier.rs"

[lints.clippy]
# ThreeM moves other people's photo libraries. A panic mid-run leaves a tree
# half-organised, so panicking helpers are banned outside `#[cfg(test)]`
# modules (which carry a local `allow` — a test that unwraps is a test that
# fails loudly, which is what we want there).
#
# NOTE for integration tests: files under `tests/` are separate crates, so the
# in-module `allow` does not reach them. Each `tests/*.rs` needs its own
# crate-level attribute at the top of the file:
#
#   #![allow(clippy::unwrap_used, clippy::expect_used)]
unwrap_used = "deny"
expect_used = "deny"

# Pedantic is on as a warning group; `-D warnings` in CI makes it binding.
# `priority = -1` lets the individual `allow`s below win over the group.
pedantic = { level = "warn", priority = -1 }

# Deliberately suppressed pedantic lints:
#   must_use_candidate  — noisy across a mostly-internal API surface; the
#                         library exists to be driven by the two binaries and
#                         the integration tests, not by third-party callers.
#   too_many_lines      — the scan/plan/move pipeline in `main` and the
#                         verifier reads better as one linear narrative than
#                         as a chain of single-call-site helpers.
#   large_stack_arrays  — the 64 KiB hashing read buffers are a deliberate
#                         throughput choice, not an oversight.
must_use_candidate = "allow"
too_many_lines = "allow"
large_stack_arrays = "allow"

[profile.release]
lto = true
strip = true
codegen-units = 1
